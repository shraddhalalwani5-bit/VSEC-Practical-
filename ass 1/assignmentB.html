<!DOCTYPE html>
<html>
<head>
    <title>Box Animation</title>

    <style>
        body {
           
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
        }

        .container {
            width: 160px;
            height: 160px;
            position: relative;
        }

        .hello {
            position: absolute;
            width: 160px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            z-index: 1;
        }

        .box {
            width: 80px;
            height: 80px;
            position: absolute;
            z-index: 2;
            transition: 1s;
        }

        .box1 {
            background-color: red;
            left: 0;
            top: 0;
        }

        .box2 {
            background-color: blue;
            left: 80px;
            top: 0;
        }

        .box3 {
            background-color: green;
            left: 0;
            top: 80px;
        }

        .box4 {
            background-color: yellow;
            left: 80px;
            top: 80px;
        }

        /* LEFT BOXES */
        .container:hover .box1 {
            transform: translate(-80px, 0) rotate(90deg);
        }

        .container:hover .box3 {
            transform: translate(-80px, 0) rotate(-90deg);
        }

        /* RIGHT BOXES */
        .container:hover .box2 {
            transform: translate(80px, 0) rotate(90deg);
        }

        .container:hover .box4 {
            transform: translate(80px, 0) rotate(-90deg);
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="hello">Hello</div>

        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>

    </div>

</body>
</html>
